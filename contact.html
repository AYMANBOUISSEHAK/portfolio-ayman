<!-- ===== PAGE CONTACT ===== -->
<main class="page contact-page">
    <div class="container">
        
        <h1 class="section-title">Contact</h1>
        
        <div class="contact-content">
            
            <div class="contact-info">
                <div class="info-item">
                    <strong>EMAIL</strong>
                    <span>bouissehak.ayman@gmail.com</span>
                </div>
                
                <div class="info-item">
                    <strong>PHONE</strong>
                    <span>+212 6 41 70 00 03</span>
                </div>
                
                <div class="info-item">
                    <strong>LOCATION</strong>
                    <span>Rabat, Morocco</span>
                </div>
                
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/ayman-bouissehak-b19950394/" target="_blank"><i class="fab fa-linkedin"></i></a>
                    <a href="https://github.com/AYMANBOUISSEHAK/" target="_blank"><i class="fab fa-github"></i></a>
                </div>
            </div>
            
            <form class="contact-form" id="contactForm">
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email" required>
                <textarea placeholder="Message" rows="5" required></textarea>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>
            
        </div>
        
    </div>
</main>

<script src="script.js"></script>
